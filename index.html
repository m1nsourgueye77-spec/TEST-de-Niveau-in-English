<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Test de positionnement – Anglais</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body{font-family:Arial;background:#f4f6f9;font-size:18px}
header{background:#0ea5a4;color:#fff;padding:20px}
.container{max-width:1000px;margin:auto;padding:20px}
.card{background:#fff;padding:20px;border-radius:10px}
.q{margin-bottom:15px;background:#f9fafb;padding:10px;border-radius:6px}
button{background:#0ea5a4;color:#fff;padding:12px 18px;border:0;border-radius:6px;cursor:pointer;margin-top:10px}
textarea{width:100%;min-height:120px}
#result{background:#e7f9f7;padding:15px;border-radius:8px;margin-top:15px}
label{display:block;margin:6px 0}
h2{margin-top:25px}

  .q{
    page-break-inside: avoid;
    break-inside: avoid;
}
</style>
</head>

<body>

<button onclick="exportPDF()">Exporter en PDF</button>

<header>
  <h1>Test de positionnement – Anglais</h1>
</header>

<div class="container">
<div class="card">

<form id="testForm">

<h2>Informations du candidat</h2>
<div class="q"><input id="nom" placeholder="Nom et prénom" required></div>
<div class="q"><input id="tel" placeholder="Téléphone" required></div>
<div class="q"><input id="email" placeholder="Email"></div>

<h2>Questions</h2>

<div class="q">
<label>1. She ___ here since 2018. (5 pts)</label>
<label><input type="radio" name="q1" value="a"> has lived</label>
<label><input type="radio" name="q1" value="b"> is living</label>
<label><input type="radio" name="q1" value="c"> lives</label>
</div>

<div class="q">
<label>2. If I ___ more time, I would travel. (5 pts)</label>
<label><input type="radio" name="q2" value="a"> have</label>
<label><input type="radio" name="q2" value="b"> had</label>
<label><input type="radio" name="q2" value="c"> will have</label>
</div>

<div class="q">
<label>3. They built the bridge in 2010. Passive voice. (5 pts)</label>
<label><input type="radio" name="q3" value="a"> The bridge was built</label>
<label><input type="radio" name="q3" value="b"> The bridge is built</label>
<label><input type="radio" name="q3" value="c"> The bridge has built</label>
</div>

<div class="q">
<label>4. "Give up" means: (5 pts)</label>
<label><input type="radio" name="q4" value="a"> abandon</label>
<label><input type="radio" name="q4" value="b"> continue</label>
<label><input type="radio" name="q4" value="c"> start</label>
</div>

<div class="q">
<label>5. Correct expression: (5 pts)</label>
<label><input type="radio" name="q5" value="a"> make a decision</label>
<label><input type="radio" name="q5" value="b"> do a decision</label>
<label><input type="radio" name="q5" value="c"> take a decide</label>
</div>

<div class="q">
<label>6. Why do you learn English? (5 pts)</label>
<label><input type="radio" name="q6" value="a"> Exams</label>
<label><input type="radio" name="q6" value="b"> Career & communication</label>
<label><input type="radio" name="q6" value="c"> Travel</label>
</div>

<div class="q">
<label>7. Mum takes ___ her baby. (5 pts)</label>
<label><input type="radio" name="q7" value="a"> care</label>
<label><input type="radio" name="q7" value="b"> out</label>
<label><input type="radio" name="q7" value="c"> up</label>
</div>

<div class="q">
<h2>Expression écrite (5 pts)</h2>
<p>Write 5–6 lines: <strong>Why is learning English important for your future?</strong></p>
<textarea id="q8"></textarea>
</div>

<button type="button" onclick="corriger()">Valider</button>
<div id="result"></div>

</form>
</div>
</div>

<script>
// ===============================
// CONFIGURATION
// ===============================

// Remplace par l'URL de ton Apps Script
const SHEET_URL = "https://script.google.com/macros/s/TON_SCRIPT_ID/exec";

// Réponses correctes
const answers = {
    q1: "a",
    q2: "b",
    q3: "a",
    q4: "a",
    q5: "a",
    q6: "b",
    q7: "a"
};

// ===============================
// CORRECTION
// ===============================

async function corriger() {

    let score = 0;

    Object.keys(answers).forEach(q => {
        const rep = document.querySelector(`input[name="${q}"]:checked`);

        if(rep && rep.value === answers[q]){
            score += 5;
        }
    });

    const redaction = document.getElementById("q8").value.trim();

    if(redaction.length >= 120){
        score += 5;
    }

    let niveau = "";
    let recommandation = "";

    if(score <= 15){

        niveau = "Débutant (A1)";

        recommandation =
        "Vous devez commencer par les bases : alphabet, verbes be/have, présent simple, vocabulaire essentiel.";

    }else if(score <= 25){

        niveau = "Élémentaire (A2)";

        recommandation =
        "Vous connaissez les bases mais devez renforcer la grammaire et la compréhension orale.";

    }else if(score <= 35){

        niveau = "Intermédiaire (B1)";

        recommandation =
        "Vous pouvez communiquer dans les situations courantes. Travaillez les temps avancés et le vocabulaire.";

    }else{

        niveau = "Avancé (B2+)";

        recommandation =
        "Très bon niveau. Concentrez-vous sur la fluidité, les expressions idiomatiques et la rédaction.";

    }

    document.getElementById("result").innerHTML = `
        <h2>Résultat</h2>

        <p><b>Score :</b> ${score}/40</p>

        <p><b>Niveau :</b> ${niveau}</p>

        <p><b>Recommandation :</b><br>${recommandation}</p>
    `;

    // Enregistrer dans Google Sheets
    enregistrer(score,niveau,recommandation);
}

// ===============================
// ENVOI GOOGLE SHEETS
// ===============================

async function enregistrer(score,niveau,recommandation){

    const data = {

        nom:document.getElementById("nom").value,

        telephone:document.getElementById("tel").value,

        email:document.getElementById("email").value,

        score:score,

        niveau:niveau,

        recommandation:recommandation,

        redaction:document.getElementById("q8").value,

        date:new Date().toLocaleString()

    };

    try{

        const response = await fetch(SHEET_URL,{

            method:"POST",

            headers:{
                "Content-Type":"application/json"
            },

            body:JSON.stringify(data)

        });

        const result = await response.json();

        console.log(result);

    }catch(err){

        console.log(err);

    }

}

// ===============================
// EXPORT PDF
// ===============================

async function exportPDF(){

    const { jsPDF } = window.jspdf;

    const zone = document.querySelector(".card");

    const canvas = await html2canvas(zone,{
        scale:2
    });

    const img = canvas.toDataURL("image/png");

    const pdf = new jsPDF("p","mm","a4");

    const largeur = 190;

    const hauteur = canvas.height * largeur / canvas.width;

    pdf.addImage(img,"PNG",10,10,largeur,hauteur);

    const nom = document.getElementById("nom").value || "Candidat";

    pdf.save(`Test_Anglais_${nom}.pdf`);

}
</script>



<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>


</body>
</html>
